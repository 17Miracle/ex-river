surface_1 = "#252529"
surface_2 = "#30303a"
surface_3 = "#3c3c47"

[colors.text]
primary = "#cdcdcd"
secondary = "#a8a8a8"
muted = "#7f8490"
disabled = "#5c6370"
inverse = "#141415"

[colors.state]
