[meta]
version = 1
name = "Vague"
description = "Vague.nvim inspired low-contrast dark theme"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#141415"
secondary_background = "#1c1c1f"
foreground = "#cdcdcd"
border = "#313244"
accent = "#8caaee"

[colors.accents]
blue = "#8caaee"
cyan = "#89dceb"
green = "#a6d189"
yellow = "#e5c890"
orange = "#ef9f76"
red = "#e78284"
magenta = "#c6a0f6"
purple = "#babbf1"

[colors.surface]
